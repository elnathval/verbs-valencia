<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Qüestionari de verbs</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="wordbox">
            <h1>Paraula</h1>
        </div>
        <div class="optionbox">
            <div>
                <p>Mode:</p>
                <select id="mode">
                    <option value="indicatiu">Indicatiu</option>
                    <option value="subjuntiu">Subjuntiu</option>
                    <option value="imperatiu">Imperatiu</option>
                    <option value="infinitiu">Infinitiu</option>
                    <option value="gerundi">Gerundi</option>
                    <option value="participi">Participi</option>
                </select>
            </div>
            <div>
                <p>Conjugació:</p>
                <select id="conjugacio">
                    <option value="primera">Primera</option>
                    <option value="segona">Segona</option>
                    <option value="tercera">Tercera</option>
                </select>
            </div>
            <div>
                <p>Persona:</p>
                <select id="persona">
                    <option value="primera">Primera</option>
                    <option value="segona">Segona</option>
                    <option value="tercera">Tercera</option>
                </select>
            </div>
            <div>
                <p>Nombre:</p>
                <select id="nombre">
                    <option value="singular">Singular</option>
                    <option value="plural">Plural</option>
                </select>
            </div>
            <div>
                <p>Temps:</p>
                <select id="temps">
                    <option value="present-simple">Present simple</option>
                    <option value="passat-simple">Passat simple</option>
                    <option value="passat-perifrastic">Passat perifràstic</option>
                    <option value="imperfet">Imperfet</option>
                    <option value="perfet">Perfet</option>
                    <option value="plusquamperfet">Plusquamperfet</option>
                    <option value="passat-anterior">Passat anterior</option>
                    <option value="passat-anterior-perifrastic">Passat anterior perifràstic</option>
                    <option value="futur-simple">Futur simple</option>
                    <option value="futur-perfet">Futur perfet</option>
                    <option value="condicional-simple">Condicional simple</option>
                    <option value="condicional-perfet">Condicional perfet</option>
                </select>

            </div>
        </div>
    </body>
</html>
