<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Qüestionari de verbs</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="wordbox">
            <h1 id="paraula">Paraula</h1>
            <h4 id="resposta"></h4>
        </div>
        <div class="optionbox">
            <div>
                <p>Mode:</p>
                <select id="mode">
                    <option value="indicatiu">Indicatiu</option>
                    <option value="subjuntiu">Subjuntiu</option>
                    <option value="imperatiu">Imperatiu</option>
                    <option value="infinitiu">Infinitiu</option>
                    <option value="gerundi">Gerundi</option>
                    <option value="participi">Participi</option>
                </select>
            </div>
            <div>
                <p>Conjugació:</p>
                <select id="conjugacio">
                    <option value="1a">Primera</option>
                    <option value="2a">Segona</option>
                    <option value="3a">Tercera</option>
                </select>
            </div>
            <div>
                <p>Persona:</p>
                <select id="persona">
                    <option value="1a">Primera</option>
                    <option value="2a">Segona</option>
                    <option value="3a">Tercera</option>
                </select>
            </div>
            <div>
                <p>Nombre:</p>
                <select id="nombre">
                    <option value="singular">Singular</option>
                    <option value="plural">Plural</option>
                </select>
            </div>
            <div>
                <p>Temps:</p>
                <select id="temps">
                    <option value="present">Present simple/Presente simple</option>
                    <option value="passat simple">Passat simple/Pasado simple</option>
                    <option value="passat perifrastic">Passat perifràstic/Pasado perifrástico</option>
                    <option value="imperfet">Imperfet/Pretérito imperfecto</option>
                    <option value="pretèrit plusquamperfet">Plusquamperfet/Pretèrito pluscuamperfecto</option>
                    <option value="passat anterior">Passat anterior/Pasado anterior</option>
                    <option value="passat anterior perifrastic">Passat anterior perifràstic/Pasado anterior perifrástico</option>
                    <option value="futur">Futur simple/Futuro simple</option>
                    <option value="futur perfet">Futur perfet/Futuro perfecto</option>
                    <option value="condicional simple">Condicional simple/Condicional simple</option>
                    <option value="condicional perfet">Condicional perfet/Condicional perfecto</option>
                    <option value="pretèrit perfet">Pretèrit perfet/Pretérito perfecto</option>
                    <option value="pretèrit perfet compost">Pretèrit perfet compost/Pretérito perfecto compuesto</option>
                    <option value="pretèrit anterior">Pretèrit anterior/Pretérito anterior</option>
                </select>

            </div>
            <div>
                <button id="comprovar" onclick="comprovar()">Comprovar</button>
                <button id="seguent" onclick="seguent()">Següent</button>
            </div>
            <div class="filtre">
                <div>
                    <p>Mode:</p>
                    <input type="checkbox" id="indicatiu" checked>
                    <label for="indicatiu">Indicatiu</label>
                    <br>
                    <input type="checkbox" id="subjuntiu" checked>
                    <label for="subjuntiu">Subjuntiu</label>
                    <br>
                    <input type="checkbox" id="imperatiu" checked>
                    <label for="imperatiu">Imperatiu</label>
                    <br>
                    <input type="checkbox" id="infinitiu" checked>
                    <label for="infinitiu">Infinitiu</label>
                    <br>
                    <input type="checkbox" id="gerundi" checked>
                    <label for="gerundi">Gerundi</label>
                    <br>
                    <input type="checkbox" id="participi" checked>
                    <label for="participi">Participi</label>
                </div>
                
                <div>
                    <p>Temps:</p>
                    <input type="checkbox" id="present" checked>
                    <label for="present">Present/Presente</label>
                    <br>
                    <input type="checkbox" id="passat simple" checked>
                    <label for="passatSimple">Passat simple/Pasado simple</label>
                    <br>
                    <input type="checkbox" id="passat perifràstic" checked>
                    <label for="passatPerifrastic">Passat perifràstic/Pasado perifrástico</label>
                    <br>
                    <input type="checkbox" id="imperfet" checked>
                    <label for="imperfet">Imperfet/Pretèrito imperfecto</label>
                    <br>
                    <input type="checkbox" id="pretèrit plusquamperfet" checked>
                    <label for="plusquamperfet">Plusquamperfet/Pretérito pluscuamperfecto</label>
                    <br>
                    <input type="checkbox" id="passat anterior" checked>
                    <label for="passatAnterior">Passat anterior/Pasado anterior</label>
                    <br>
                    <input type="checkbox" id="passat anterior perifràstic" checked>
                    <label for="passatAnteriorPerifrastic">Passat anterior perifràstic/Pasado anterior perifrástico</label>
                    <br>
                    <input type="checkbox" id="futur" checked>
                    <label for="futur">Futur simple/Futuro simple</label>
                    <br>
                    <input type="checkbox" id="futur perfet" checked>
                    <label for="futurPerfet">Futur perfet/Futuro perfecto</label>
                    <br>
                    <input type="checkbox" id="condicional simple" checked>
                    <label for="condicionalSimple">Condicional simple</label>
                    <br>
                    <input type="checkbox" id="condicional perfet" checked>
                    <label for="condicionalPerfet">Condicional perfet/Condicional perfecto</label>
                    <br>
                    <input type="checkbox" id="pretèrit perfet" checked>
                    <label for="pretèritPerfet">Pretèrit perfet/Pretérito perfecto</label>
                    <br>
                    <input type="checkbox" id="pretèrit perfet compost" checked>
                    <label for="pretèritPerfetCompost">Pretèrit perfet compost/Pretérito perfecto compuesto</label>
                    <br>
                    <input type="checkbox" id="pretèrit anterior" checked>
                    <label for="pretèritAnterior">Pretèrit anterior/Pretérito anterior</label>
                </div>
                
            </div>
        </div>
        
    </body>
</html>
